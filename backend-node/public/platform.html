<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Owner Panel · Chai Order System</title>
<style>
:root{
  --bg:#f4f6f5; --surface:#ffffff; --surface-2:#f8faf9; --line:#e4e9e6; --line-2:#d3dbd7;
  --ink:#0f1f17; --ink-2:#3f5148; --muted:#6f8178;
  --brand:#0f7a43; --brand-2:#0b6136; --brand-soft:#e3f4ea; --brand-ink:#ffffff;
  --blue:#2563eb; --blue-soft:#e6eefc; --amber:#b45309; --amber-soft:#fdf1da; --red:#c0302a; --red-soft:#fde9e7; --gray-soft:#eceff0;
  --shadow-1:0 1px 2px rgba(15,31,23,.06),0 1px 1px rgba(15,31,23,.04);
  --shadow-2:0 10px 30px -10px rgba(15,31,23,.18),0 2px 6px rgba(15,31,23,.06);
  --side:#0d2418; --side-ink:#cfe3d7; --side-muted:#7f9d8d; --side-active:#16402a;
  --radius:14px; --radius-s:10px;
}
:root[data-theme="dark"]{
  --bg:#0b110e; --surface:#121a16; --surface-2:#16201b; --line:#22302a; --line-2:#2c3c35;
  --ink:#e8f1ec; --ink-2:#b4c6bc; --muted:#7f948a;
  --brand:#34c27a; --brand-2:#2aa868; --brand-soft:#12301f; --brand-ink:#04150c;
  --blue:#7aa2ff; --blue-soft:#17233f; --amber:#f0b04a; --amber-soft:#33260f; --red:#ff7b73; --red-soft:#3a1816; --gray-soft:#1d2723;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 14px 34px -10px rgba(0,0,0,.6);
  --side:#08100c; --side-active:#12251b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.hide{display:none!important}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 22px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#34c27a,#0f7a43);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px -6px rgba(52,194,122,.7)}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.2px}
.brand span{font-size:11.5px;color:var(--side-muted);text-transform:uppercase;letter-spacing:.12em}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-ink);text-decoration:none;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
.nav a svg{width:19px;height:19px;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 #34c27a}
.nav a .badge{margin-left:auto}
.badge{background:#f0b04a;color:#2b1d00;font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;min-width:20px;text-align:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.05)}
.avatar{width:34px;height:34px;border-radius:50%;background:#1d4a31;color:#bff0d4;display:grid;place-items:center;font-weight:700;flex:none}
.me b{display:block;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.me span{font-size:11.5px;color:var(--side-muted);text-transform:capitalize}
.side-btns{display:flex;gap:8px}
.side-btns button{flex:1;background:rgba(255,255,255,.07);border:0;color:var(--side-ink);padding:8px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px}
.side-btns button:hover{background:rgba(255,255,255,.13)}
.side-btns svg{width:16px;height:16px}

.main{min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:22px 32px 6px;flex-wrap:wrap}
.top h1{font-size:24px;letter-spacing:-.4px}
.top p{color:var(--muted);margin-top:2px}
.top .grow{flex:1}
.hamb{display:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;cursor:pointer;place-items:center}
.hamb svg{width:20px;height:20px}
.content{padding:16px 32px 48px;max-width:1280px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:1px solid transparent;border-radius:var(--radius-s);padding:9px 16px;font-weight:600;cursor:pointer;background:var(--brand);color:var(--brand-ink);transition:transform .08s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{background:var(--brand-2);box-shadow:0 6px 16px -8px var(--brand)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn.ghost:hover{background:var(--surface-2);box-shadow:none}
.btn.danger{background:var(--red);color:#fff}
.btn.danger:hover{background:#a52620}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.soft:hover{box-shadow:none;filter:brightness(.97)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}
.btn svg{width:16px;height:16px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius-s);padding:9px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:0 0 5px}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch b{display:block}
.tgl{position:relative;width:44px;height:25px;flex:none}
.tgl input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.tgl i{position:absolute;inset:0;background:var(--line-2);border-radius:99px;transition:background .2s}
.tgl i:after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tgl input:checked+i{background:var(--brand)}
.tgl input:checked+i:after{transform:translateX(19px)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-1)}
.card.pad{padding:20px}
.card h3{font-size:15px;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:14px;margin-bottom:16px}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:6px;cursor:default;transition:transform .15s,box-shadow .15s}
.stat.link{cursor:pointer}
.stat.link:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.stat .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.stat .ic svg{width:18px;height:18px}
.stat .ic.blue{background:var(--blue-soft);color:var(--blue)}
.stat .ic.amber{background:var(--amber-soft);color:var(--amber)}
.stat .ic.red{background:var(--red-soft);color:var(--red)}
.stat b{font-size:26px;letter-spacing:-.5px;line-height:1.1}
.stat span{color:var(--muted);font-size:12.5px}
.hero{background:linear-gradient(135deg,#0f7a43 0%,#0b5a33 55%,#08402a 100%);color:#fff;border:0;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero:after{content:"";position:absolute;right:60px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero .sub,.hero h3{color:rgba(255,255,255,.85)}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-1px;position:relative}
.hero .row{display:flex;gap:28px;flex-wrap:wrap;margin-top:12px;position:relative}
.hero .row div span{display:block;font-size:12px;opacity:.75}
.hero .row div b{font-size:17px}
.dgrid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px;margin-bottom:14px}
.dgrid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.dgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}

/* ---------- table ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .search{flex:1;min-width:220px;position:relative}
.toolbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.toolbar .search input{padding-left:36px}
.toolbar select{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink-2);transition:all .15s}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip em{font-style:normal;opacity:.7;margin-left:4px}
.tablewrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;min-width:780px}
th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td .name{font-weight:600}
td .small{font-size:12px;color:var(--muted)}
td.right,th.right{text-align:right}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.active{background:var(--brand-soft);color:var(--brand)}
.pill.trial{background:var(--blue-soft);color:var(--blue)}
.pill.pending{background:var(--amber-soft);color:var(--amber)}
.pill.expired,.pill.suspended{background:var(--red-soft);color:var(--red)}
.pill.plain{background:var(--gray-soft);color:var(--ink-2)}
.pill.plain:before{display:none}
.left{font-size:12px;margin-top:2px}
.left.warn{color:var(--amber)} .left.bad{color:var(--red)} .left.ok{color:var(--muted)}
.empty{padding:54px 20px;text-align:center;color:var(--muted)}
.empty svg{width:42px;height:42px;opacity:.45;margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
.skel{border-radius:8px;background:linear-gradient(90deg,var(--gray-soft),var(--line),var(--gray-soft));background-size:200% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- lists / activity ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:8px 12px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .grow{flex:1 1 170px;min-width:0}
.li .acts{display:flex;gap:6px;align-items:center;margin-left:auto}
.li small.ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{color:var(--muted);font-size:12px}
.dot{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.dot svg{width:16px;height:16px}
.dot.amber{background:var(--amber-soft);color:var(--amber)} .dot.red{background:var(--red-soft);color:var(--red)} .dot.blue{background:var(--blue-soft);color:var(--blue)} .dot.gray{background:var(--gray-soft);color:var(--ink-2)}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto}

/* ---------- plans ---------- */
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.plan{padding:20px;display:flex;flex-direction:column;gap:10px;position:relative}
.plan .price{font-size:30px;font-weight:700;letter-spacing:-1px}
.plan .price small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
.plan li{display:flex;gap:8px;align-items:center}
.plan li svg{width:15px;height:15px;color:var(--brand);flex:none}
.plan .tag{position:absolute;right:16px;top:16px}
.plan.off{opacity:.6}

/* ---------- overlay: modal + drawer ---------- */
.ov{position:fixed;inset:0;background:rgba(6,14,10,.55);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto;animation:fadeo .18s ease}
@keyframes fadeo{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:520px;box-shadow:var(--shadow-2);border:1px solid var(--line);animation:pop .2s ease}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal header{padding:20px 22px 0}
.modal header h3{font-size:18px}
.modal header p{color:var(--muted);margin-top:2px}
.modal .body{padding:18px 22px}
.modal footer{padding:0 22px 20px;display:flex;gap:10px;justify-content:flex-end}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);z-index:51;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4);display:flex;flex-direction:column;animation:slide .22s ease;border-left:1px solid var(--line)}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.drawer .dh{padding:20px 24px 0;background:var(--surface);border-bottom:1px solid var(--line)}
.drawer .dh .t{display:flex;align-items:flex-start;gap:12px}
.drawer .dh h2{font-size:20px;letter-spacing:-.3px}
.x{margin-left:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.x svg{width:18px;height:18px}
.tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--brand);border-color:var(--brand)}
.drawer .db{padding:20px 24px 40px;overflow-y:auto;flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi span{display:block;font-size:11.5px;color:var(--muted)}
.kpi b{font-size:18px}
.kpi small{color:var(--muted);font-size:11.5px}
.meta{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin-bottom:16px}
.meta dt{color:var(--muted)} .meta dd{margin:0;font-weight:500;word-break:break-word}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.box h4{margin:0 0 10px;font-size:13.5px}
.box.danger{border-color:color-mix(in srgb,var(--red) 40%,var(--line));background:color-mix(in srgb,var(--red-soft) 50%,var(--surface))}
.bar{height:6px;border-radius:99px;background:var(--gray-soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar i.full{background:var(--red)}

/* ---------- login ---------- */
.lg{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lg-art{background:linear-gradient(150deg,#0b3a24 0%,#0f7a43 60%,#34c27a 130%);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lg-art:before,.lg-art:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
.lg-art:before{width:420px;height:420px;right:-140px;top:-120px}
.lg-art:after{width:300px;height:300px;left:-90px;bottom:-110px}
.lg-art h2{font-size:34px;letter-spacing:-1px;line-height:1.15;max-width:420px;position:relative}
.lg-art p{opacity:.82;max-width:380px;margin-top:12px;position:relative}
.lg-art .brand b{color:#fff}
.lg-form{display:grid;place-items:center;padding:30px}
.lg-form .box{width:100%;max-width:380px;padding:30px;box-shadow:var(--shadow-2)}
.lg-form h2{font-size:22px;margin-bottom:4px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}

/* ---------- toast ---------- */
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:99}
.toast{background:#10231a;color:#e8f6ee;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-2);display:flex;align-items:center;gap:10px;max-width:360px;animation:pop .2s ease;border-left:4px solid #34c27a}
.toast.err{border-color:#ff7b73}
.toast svg{width:18px;height:18px;flex:none}

/* ---------- responsive ---------- */
@media (max-width:1100px){.dgrid,.dgrid3{grid-template-columns:1fr 1fr}.dgrid>.hero{grid-column:1/-1}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:60;transform:translateX(-102%);transition:transform .22s ease}
  .side.open{transform:none;box-shadow:20px 0 50px rgba(0,0,0,.4)}
  .hamb{display:grid}
  .top{padding:18px 18px 4px}.content{padding:14px 18px 40px}
  .dgrid,.dgrid2,.dgrid3{grid-template-columns:1fr}
  .lg{grid-template-columns:1fr}.lg-art{display:none}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){.grid2,.grid3,.kpis{grid-template-columns:1fr 1fr}.meta{grid-template-columns:1fr}.top h1{font-size:21px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<script>
(function () {

    for (i = 2; i < arguments.length; i++) add(e, arguments[i]);

  }
  function add(e, kid) {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(function (x) { add(e, x); }); return; }
    e.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  var $ = function (s, r) { return (r || document).querySelector(s); };
